[project]
name = "quant"
version = "0.1.0"
description = "한국 주식 자동매매 시스템 (KIS Developers + 백테스트)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ohsc" }]

dependencies = [
    # ----- 가격/공시 데이터 -----
    "setuptools>=70,<80",           # pykrx 가 pkg_resources 사용. setuptools 80에서 제거됨
    "pykrx>=1.0.45",                # KRX 공식 데이터 (일봉, 종목)
    "finance-datareader>=0.9.94",   # 보조 데이터 소스
    "pandas-market-calendars>=4.4",  # KRX 거래일 캘린더

    # ----- 데이터 처리 -----
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26,<2.0",             # vectorbt/numba 호환 위해 1.x 고정
    "pyarrow>=15.0",                # parquet I/O

    # ----- 저장소 -----
    "sqlalchemy>=2.0",              # SQLite 메타데이터
    "alembic>=1.13",                # DB 마이그레이션 (옵션)

    # ----- 백테스트 -----
    "vectorbt>=0.26",
    "quantstats>=0.0.62",           # 성과 리포트

    # ----- KIS API (Phase 4 라이브) -----
    "httpx>=0.27",                  # REST 비동기 클라이언트
    "websockets>=12.0",             # WebSocket 시세

    # ----- 설정/유틸 -----
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.12",                  # CLI 진입점
    "tenacity>=8.3",                # 재시도 로직

    # ----- 시각화 (스크립트/노트북 공용) -----
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipdb>=0.13",
]
jupyter = [
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "seaborn>=0.13",
]

[project.scripts]
quant = "quant.cli:app"

# ----- uv -----
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

# ----- ruff -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff
]
ignore = [
    "E501",   # line too long (formatter handles)
    "UP042",  # str+Enum → StrEnum (호환성 위해 (str, Enum) 패턴 유지)
    "RUF001", # ambiguous unicode in identifiers (한국어 주석에서 빈번한 오탐)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

# ----- mypy -----
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["src/quant"]
