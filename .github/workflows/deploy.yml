name: Deploy to Server

# 서버 정보(host, user, ssh key)는 모두 GitHub Secrets에 저장되며
# 이 파일·로그·아티팩트 어디에도 평문 노출되지 않는다.
#
# 필요한 Secrets:
#   SSH_HOST            서버 호스트 (또는 IP)
#   SSH_USER            ssh 사용자명
#   SSH_PRIVATE_KEY     private key (PEM 형식)
#   SSH_PORT            (선택) 기본 22
#   PROJECT_DIR         (선택) 서버에서 프로젝트 경로 (기본 ~/quant)
#
# 흐름:
#   1. main push 시 트리거
#   2. SSH로 서버 접속 → git pull → docker build → 컨테이너 안에서 pytest
#      (runner에선 의존성 설치 안 함 — 서버 docker가 모든 의존성 보유)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/deploy/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + Build + Test on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR || '~/quant' }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -lc "'
            set -e
            cd $PROJECT_DIR
            echo \"=== git pull ===\"
            git pull --ff-only
            echo \"=== docker build ===\"
            docker compose build app
            echo \"=== pytest in container ===\"
            docker compose run --rm app pytest -q
            echo \"Deploy OK: \$(git rev-parse --short HEAD)\"
          '"
